name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @samm/web build
      - name: Synthèse CDK (vérifie l'infrastructure et l'empaquetage des Lambdas)
        run: pnpm --filter @samm/infra exec cdk synth HubIt --quiet
        env:
          CDK_DEFAULT_ACCOUNT: '000000000000'
